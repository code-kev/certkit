name: NSS diagnostics

on:
  pull_request:
    paths:
      - .github/workflows/nss-diagnostics.yml

permissions: {}

concurrency:
  group: nss-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: NSS diagnostic (${{ matrix.environment }})
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: UCRT64
            directory: ucrt64
            package: mingw-w64-ucrt-x86_64-nss
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
        shell: pwsh
      - id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: ${{ matrix.environment }}
          update: true
          cache: false
          install: ${{ matrix.package }} mingw-w64-ucrt-x86_64-gcc
      - name: Configure original-process crash capture
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          NSS_DIRECTORY: ${{ matrix.directory }}
        run: |
          $nssBin = Join-Path $env:MSYS2_LOCATION "$env:NSS_DIRECTORY\bin"
          $env:PATH = "$nssBin;$env:PATH"
          $env:CERTKIT_CERTUTIL = Join-Path $nssBin 'certutil.exe'
          $env:CERTKIT_NSS_CDB = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (-not (Test-Path $env:CERTKIT_CERTUTIL)) { throw 'NSS certutil missing' }
          if (-not (Test-Path $env:CERTKIT_NSS_CDB)) {
            $sdk = Get-ItemProperty 'HKLM:\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' | Where-Object DisplayName -Match 'Windows Software Development Kit' | Sort-Object DisplayVersion -Descending | Select-Object -First 1
            if (-not $sdk.BundleCachePath) { throw 'No cached SDK debugger installer' }
            $signature = Get-AuthenticodeSignature $sdk.BundleCachePath
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike 'CN=Microsoft Corporation,*') { throw 'SDK signature invalid' }
            $installer = Start-Process $sdk.BundleCachePath -ArgumentList '/features','OptionId.WindowsDesktopDebuggers','/q','/norestart' -Wait -PassThru
            if ($installer.ExitCode -notin 0,3010 -or -not (Test-Path $env:CERTKIT_NSS_CDB)) { throw 'Cached SDK debugger install failed' }
          }
          $nssBin >> $env:GITHUB_PATH
          "CERTKIT_NSS_CDB=$env:CERTKIT_NSS_CDB" >> $env:GITHUB_ENV
          $env:CERTKIT_NSS_DUMPS = Join-Path $env:RUNNER_TEMP 'certkit-nss-dumps'
          New-Item -ItemType Directory -Path $env:CERTKIT_NSS_DUMPS -Force | Out-Null
          "CERTKIT_NSS_DUMPS=$env:CERTKIT_NSS_DUMPS" >> $env:GITHUB_ENV
          $decoder = Join-Path $env:RUNNER_TEMP 'certkit-nss-decode.cjs'
          @'
          const { spawnSync } = require('node:child_process');
          const { readdirSync, statSync, unlinkSync } = require('node:fs');
          const { join } = require('node:path');
          const { setTimeout: pause } = require('node:timers/promises');
          async function main() {
            const image = process.argv[2] ?? 'certutil.exe';
            let dumps = [];
            let previousSize = -1;
            let stablePolls = 0;
            let ready = false;
            for (let i = 0; i < 120; i++) {
              dumps = readdirSync(process.env.CERTKIT_NSS_DUMPS).filter(name => name.startsWith(`${image}.`) && name.endsWith('.dmp'));
              if (dumps.length) {
                const size = statSync(join(process.env.CERTKIT_NSS_DUMPS, dumps[0])).size;
                stablePolls = size > 0 && size === previousSize ? stablePolls + 1 : 0;
                previousSize = size;
                if (stablePolls >= 4) { ready = true; break; }
              }
              await pause(250);
            }
            if (!dumps.length) {
              if (image !== 'certutil.exe') throw new Error('WER canary produced no minidump');
              console.log('No original NSS crash dump captured.');
              return;
            }
            if (!ready) throw new Error('Native minidump did not finish within the bounded wait');
            for (const name of dumps) {
              const file = join(process.env.CERTKIT_NSS_DUMPS, name);
              try {
                const result = spawnSync(process.env.CERTKIT_NSS_CDB, ['-z', file, '-y', process.env.RUNNER_TEMP, '-c', '.ecxr; .exr -1; k 8; q'], { encoding: 'utf8', timeout: 30000, maxBuffer: 64 * 1024 });
                if (result.error || result.signal || result.status !== 0) throw new Error(`Native dump decoder failed: status=${result.status}, signal=${result.signal}, error=${result.error?.message ?? 'none'}`);
                const lines = `${result.stdout ?? ''}\n${result.stderr ?? ''}`.split(/\r?\n/);
                const exception = lines.filter(line => /^\s*Exception(?:Address|Code):/.test(line));
                const frames = lines.filter(line => /^\s*[0-9a-f]{2}\s+[0-9a-f`]+\s+[0-9a-f`]+\s+\S/i.test(line)).slice(0, 8);
                if (image === 'certkit-nss-av.exe') console.log(`Synthetic dump parse: exceptionFields=${exception.length}, avCode=${exception.some(line => /ExceptionCode:\s*c0000005/i.test(line))}, frameCandidates=${lines.filter(line => /^\s*[0-9a-f]{1,2}\s+/i.test(line)).length}, selectedFrames=${frames.length}`);
                if (!exception.some(line => /ExceptionCode:\s*c0000005/i.test(line)) || !frames.length) throw new Error('Native AV exception/stack missing from decoded minidump');
                console.log(`Original native AV captured for ${image}`);
                console.log([...exception, ...frames].join('\n'));
              } finally {
                unlinkSync(file);
              }
            }
          }
          main().catch(error => { console.error(error.message); process.exitCode = 1; });
          '@ | Set-Content -Encoding ascii $decoder
          $werRoot = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          $images = @('certutil.exe', 'certkit-nss-av.exe')
          foreach ($image in $images) {
            if (Test-Path "$werRoot\$image") { throw 'Existing per-image WER configuration would be overwritten' }
          }
          New-Item -ItemType File (Join-Path $env:RUNNER_TEMP 'certkit-nss-wer-owned') | Out-Null
          foreach ($image in $images) {
            $key = "$werRoot\$image"
            New-Item $key -Force | Out-Null
            New-ItemProperty $key -Name DumpFolder -Value $env:CERTKIT_NSS_DUMPS -PropertyType ExpandString -Force | Out-Null
            New-ItemProperty $key -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
            New-ItemProperty $key -Name DumpCount -Value 1 -PropertyType DWord -Force | Out-Null
          }
          $canarySource = Join-Path $env:RUNNER_TEMP 'certkit-nss-av.c'
          $env:CERTKIT_NSS_CANARY = Join-Path $env:RUNNER_TEMP 'certkit-nss-av.exe'
          @'
          int main(int argc, char **argv) {
            if (argc > 1) return argv[1][0] == '7' ? 7 : 0;
            volatile int *volatile target = (int *)0;
            *target = 1;
            return 0;
          }
          '@ | Set-Content -Encoding ascii $canarySource
          & (Join-Path $nssBin 'gcc.exe') -g -O0 $canarySource -o $env:CERTKIT_NSS_CANARY
          if ($LASTEXITCODE -ne 0) { throw 'Native WER canary build failed' }
          $launcherSource = Join-Path $env:RUNNER_TEMP 'certkit-nss-launch.c'
          $env:CERTKIT_NSS_LAUNCHER = Join-Path $env:RUNNER_TEMP 'certkit-nss-launch.exe'
          @'
          #include <windows.h>
          #include <process.h>
          #include <stdlib.h>
          #include <stdint.h>
          int wmain(int argc, wchar_t **argv) {
            const wchar_t *binary = _wgetenv(L"CERTKIT_NSS_NATIVE");
            if (!binary || argc < 1) return 1;
            SetErrorMode(GetErrorMode() & ~SEM_NOGPFAULTERRORBOX);
            argv[0] = (wchar_t *)binary;
            intptr_t status = _wspawnv(_P_WAIT, binary, (const wchar_t *const *)argv);
            return status == -1 ? 1 : (int)status;
          }
          '@ | Set-Content -Encoding ascii $launcherSource
          & (Join-Path $nssBin 'gcc.exe') -municode $launcherSource -o $env:CERTKIT_NSS_LAUNCHER
          if ($LASTEXITCODE -ne 0) { throw 'Native WER launcher build failed' }
          $env:CERTKIT_NSS_NATIVE = $env:CERTKIT_NSS_CANARY
          @'
          const { spawnSync } = require('node:child_process');
          for (const [args, expected] of [[['0'], 0], [['7'], 7], [[], 0xc0000005]]) {
            const result = spawnSync(process.env.CERTKIT_NSS_LAUNCHER, args, { timeout: 30000 });
            if (result.error || result.signal || result.status !== expected) throw new Error(`Native WER launcher did not preserve exit: expected=${expected}, status=${result.status}, signal=${result.signal}, error=${result.error?.message ?? 'none'}`);
            console.log(`Native WER launcher preserved exit ${expected}.`);
          }
          '@ | node
          if ($LASTEXITCODE -ne 0) { throw 'Native WER canary failed' }
          node $decoder 'certkit-nss-av.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Native WER canary dump decoding failed' }
          $env:CERTKIT_NSS_NATIVE = $env:CERTKIT_CERTUTIL
          $env:CERTKIT_CERTUTIL = $env:CERTKIT_NSS_LAUNCHER
          "CERTKIT_NSS_NATIVE=$env:CERTKIT_NSS_NATIVE" >> $env:GITHUB_ENV
          "CERTKIT_CERTUTIL=$env:CERTKIT_CERTUTIL" >> $env:GITHUB_ENV
          pnpm build
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic build failed' }
      - name: Capture original NSS failure under Bash launch
        shell: bash
        run: pnpm coverage --bail=1
      - name: Decode native exception and remove diagnostic state
        if: always()
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'certkit-nss-dumps'
          $decoder = Join-Path $env:RUNNER_TEMP 'certkit-nss-decode.cjs'
          $marker = Join-Path $env:RUNNER_TEMP 'certkit-nss-wer-owned'
          try {
            if ((Test-Path $decoder) -and (Test-Path $folder) -and $env:CERTKIT_NSS_CDB) {
              node $decoder
              if ($LASTEXITCODE -ne 0) { throw 'Original NSS crash decoding failed' }
            }
          } finally {
            if (Test-Path $marker) {
              foreach ($image in @('certutil.exe', 'certkit-nss-av.exe')) {
                Remove-Item "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\$image" -Recurse -Force -ErrorAction SilentlyContinue
              }
              Remove-Item $marker -Force
            }
            if (Test-Path $folder) { Remove-Item $folder -Recurse -Force }
          }
