name: NSS diagnostics

on:
  pull_request:
    paths:
      - .github/workflows/nss-diagnostics.yml

permissions: {}

concurrency:
  group: nss-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: NSS diagnostic (${{ matrix.environment }})
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: UCRT64
            directory: ucrt64
            package: mingw-w64-ucrt-x86_64-nss
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
        shell: pwsh
      - id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: ${{ matrix.environment }}
          update: true
          cache: false
          install: ${{ matrix.package }} mingw-w64-ucrt-x86_64-gdb mingw-w64-ucrt-x86_64-gcc
      - name: Configure native NSS diagnostics
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          NSS_DIRECTORY: ${{ matrix.directory }}
        run: |
          $nssBin = Join-Path $env:MSYS2_LOCATION "$env:NSS_DIRECTORY\bin"
          $env:PATH = "$nssBin;$env:PATH"
          $env:CERTKIT_CERTUTIL = Join-Path $nssBin 'certutil.exe'
          $env:CERTKIT_NSS_DEBUGGER = Join-Path $nssBin 'gdb.exe'
          $env:CERTKIT_NSS_GDB_SCRIPT = Join-Path $env:RUNNER_TEMP 'nss-gdb.txt'
          if (-not (Test-Path $env:CERTKIT_CERTUTIL)) { throw 'NSS certutil missing' }
          if (-not (Test-Path $env:CERTKIT_NSS_DEBUGGER)) { throw 'Native GDB missing' }
          $nssBin >> $env:GITHUB_PATH
          "CERTKIT_CERTUTIL=$env:CERTKIT_CERTUTIL" >> $env:GITHUB_ENV
          "CERTKIT_NSS_DEBUGGER=$env:CERTKIT_NSS_DEBUGGER" >> $env:GITHUB_ENV
          "CERTKIT_NSS_GDB_SCRIPT=$env:CERTKIT_NSS_GDB_SCRIPT" >> $env:GITHUB_ENV
          @'
          set pagination off
          set print thread-events off
          set print frame-arguments none
          run
          if $_isvoid ($_exitcode)
            bt 8
            quit 1
          end
          quit $_exitcode
          '@ | Set-Content -Encoding ascii $env:CERTKIT_NSS_GDB_SCRIPT
          $canarySource = Join-Path $env:RUNNER_TEMP 'nss-gdb-canary.c'
          $env:CERTKIT_NSS_GDB_CANARY = Join-Path $env:RUNNER_TEMP 'nss-gdb-canary.exe'
          @'
          int main(int argc, char **argv) {
            if (argc > 1) return argv[1][0] == '7' ? 7 : 0;
            volatile int *volatile target = (int *)0;
            *target = 1;
            return 0;
          }
          '@ | Set-Content -Encoding ascii $canarySource
          & (Join-Path $nssBin 'gcc.exe') -g -O0 $canarySource -o $env:CERTKIT_NSS_GDB_CANARY
          if ($LASTEXITCODE -ne 0) { throw 'Native debugger canary build failed' }
          @'
          const { spawnSync } = require('node:child_process');
          const common = ['-quiet', '-nx', '-batch', '-iex', 'set auto-load off', '-iex', 'set debuginfod enabled off', '-x', process.env.CERTKIT_NSS_GDB_SCRIPT, '--args', process.env.CERTKIT_NSS_GDB_CANARY];
          for (const [args, expected] of [[['0'], 0], [['7'], 7], [[], 1]]) {
            const result = spawnSync(process.env.CERTKIT_NSS_DEBUGGER, [...common, ...args], { encoding: 'utf8', timeout: 30000, maxBuffer: 64 * 1024 });
            const output = `${result.stdout ?? ''}\n${result.stderr ?? ''}`;
            if (result.error || result.signal || result.status !== expected) throw new Error(`Debugger canary failed: expected=${expected}, status=${result.status}, signal=${result.signal}, error=${result.error?.message ?? 'none'}\n${output}`);
            if (!args.length && (!/SIGSEGV/.test(output) || !/#0\s+.*main/.test(output))) throw new Error(`Debugger canary failed to capture the native AV stack\n${output}`);
            console.log(`Native debugger canary passed: exit ${expected}${args.length ? '' : ', SIGSEGV and main stack captured'}`);
          }
          '@ | node
          if ($LASTEXITCODE -ne 0) { throw 'Native debugger canary failed' }
          pnpm build
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic build failed' }
      - name: Capture original NSS failure under Bash launch
        shell: bash
        run: pnpm coverage --bail=1
      - name: Report NSS native fault metadata
        if: failure()
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          NSS_DIRECTORY: ${{ matrix.directory }}
        run: |
          $expected = Join-Path $env:MSYS2_LOCATION "$env:NSS_DIRECTORY\bin\certutil.exe"
          $events = Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Id = 1000; StartTime = (Get-Date).AddMinutes(-15) } -MaxEvents 20 -ErrorAction SilentlyContinue
          foreach ($event in $events) {
            $values = @{}
            foreach ($item in ([xml]$event.ToXml()).Event.EventData.Data) { $values[$item.Name] = $item.InnerText }
            if ($values['AppPath'] -ine $expected) { continue }
            foreach ($field in @('AppPath', 'AppVersion', 'ModuleName', 'ModulePath', 'ModuleVersion', 'ExceptionCode', 'FaultingOffset', 'ProcessId')) {
              Write-Host "$field=$($values[$field])"
            }
          }
