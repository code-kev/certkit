name: Release
run-name: Release ${{ inputs.release_sha || github.sha }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_sha:
        description: Main commit to validate and use for first-publication bootstrap
        required: true
        type: string
      finalize_published_release:
        description: Complete metadata for an already-published version with its matching tag
        required: false
        default: false
        type: boolean
      resume_tagged_release:
        description: Recover a tagged release using its original tested artifact
        required: false
        default: false
        type: boolean
      resume_artifact_id:
        description: Exact original artifact ID required for tagged release recovery
        required: false
        type: string

permissions: {}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: validate-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      actions: read
    outputs:
      selected: ${{ steps.source.outputs.selected }}
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
      published: ${{ steps.package.outputs.published }}
      integrity: ${{ steps.package.outputs.integrity }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate selected source and required checks
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          requested_sha="$RELEASE_SHA"
          resolved_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          [[ "$resolved_sha" == "$requested_sha" ]] || exit 1
          export RELEASE_SHA="$resolved_sha"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          version="$(git show "$RELEASE_SHA:package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')"
          [[ -n "$version" ]]
          if [[ "$EVENT_NAME" == push ]]; then
            RELEASE_VERSION="$version" node scripts/release.mjs version
          fi
          node scripts/release.mjs repository
          RELEASE_VERSION="$version" node scripts/release.mjs checks
          {
            echo "selected=$RELEASE_SHA"
            echo "version=$version"
            echo "tag=v$version"
          } >> "$GITHUB_OUTPUT"
      - name: Detect package version state
        id: package
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
        run: node scripts/release.mjs state >> "$GITHUB_OUTPUT"
      - name: Guard workflow-dispatch mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          FINALIZE_PUBLISHED_RELEASE: ${{ inputs.finalize_published_release }}
          RESUME_TAGGED_RELEASE: ${{ inputs.resume_tagged_release }}
          PACKAGE_PUBLISHED: ${{ steps.package.outputs.published }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          RELEASE_SHA: ${{ steps.source.outputs.selected }}
        run: |
          if [[ "$EVENT_NAME" != workflow_dispatch ]]; then
            exit 0
          fi
          test "$FINALIZE_PUBLISHED_RELEASE" != true || test "$RESUME_TAGGED_RELEASE" != true
          if [[ "$RESUME_TAGGED_RELEASE" == true ]]; then
            test "$PACKAGE_PUBLISHED" = false || test "$PACKAGE_PUBLISHED" = true
            test "$GITHUB_REF" = refs/heads/main
            expected_tag="v$RELEASE_VERSION"
            git fetch --force --no-tags origin "refs/tags/$expected_tag:refs/tags/$expected_tag"
            tag_sha="$(git rev-parse --verify "refs/tags/$expected_tag^{commit}")"
            if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
              echo "version tag $expected_tag does not target selected source commit" >&2
              exit 1
            fi
            exit 0
          fi
          if [[ "$FINALIZE_PUBLISHED_RELEASE" == true ]]; then
            test "$PACKAGE_PUBLISHED" = true
            expected_tag="v$RELEASE_VERSION"
            git fetch --force --no-tags origin "refs/tags/$expected_tag:refs/tags/$expected_tag"
            tag_sha="$(git rev-parse --verify "refs/tags/$expected_tag^{commit}")"
            if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
              echo "version tag $expected_tag does not target selected source commit" >&2
              exit 1
            fi
          else
            test "$PACKAGE_PUBLISHED" = false
          fi

  resolve-artifact:
    name: resolve-tested-artifact
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      reuse: ${{ steps.resolve.outputs.reuse }}
      run_id: ${{ steps.resolve.outputs.run_id }}
      artifact_id: ${{ steps.resolve.outputs.artifact_id }}
      name: ${{ steps.resolve.outputs.name }}
      event: ${{ steps.resolve.outputs.event }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.selected }}
          persist-credentials: false
      - name: Find one immutable prior tarball
        id: resolve
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.selected }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          PACKAGE_PUBLISHED: ${{ needs.validate.outputs.published }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/release.mjs resolve-artifact
      - name: Require the original artifact for tagged release recovery
        if: inputs.resume_tagged_release
        env:
          RESUME_ARTIFACT_ID: ${{ inputs.resume_artifact_id }}
          RESOLVED_REUSE: ${{ steps.resolve.outputs.reuse }}
          RESOLVED_ARTIFACT_ID: ${{ steps.resolve.outputs.artifact_id }}
        run: |
          [[ "$RESUME_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          test "$RESOLVED_REUSE" = true
          test "$RESOLVED_ARTIFACT_ID" = "$RESUME_ARTIFACT_ID"

  produce:
    name: produce-or-reuse-tarball
    needs: [validate, resolve-artifact]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.identity.outputs.artifact_id }}
      run_id: ${{ steps.identity.outputs.run_id }}
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.selected }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Reuse the existing artifact
        if: needs.resolve-artifact.outputs.reuse == 'true'
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.resolve-artifact.outputs.artifact_id }}
          run-id: ${{ needs.resolve-artifact.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release
      - name: Build and pack once
        if: needs.resolve-artifact.outputs.reuse != 'true'
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.selected }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          mkdir -p release
          npm pack --ignore-scripts --pack-destination release
          tarball="$(find release -maxdepth 1 -name 'certkit-*.tgz' -type f -print -quit)"
          test -n "$tarball"
          node scripts/release.mjs manifest "$tarball" release/manifest.json
      - name: Upload the produced tarball once
        if: needs.resolve-artifact.outputs.reuse != 'true'
        id: upload
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ needs.resolve-artifact.outputs.name }}
          path: release/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Verify artifact identity
        id: identity
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.selected }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          PACKAGE_PUBLISHED: ${{ needs.validate.outputs.published }}
          REGISTRY_INTEGRITY: ${{ needs.validate.outputs.integrity }}
          ARTIFACT_RUN_ID: ${{ needs.resolve-artifact.outputs.reuse == 'true' && needs.resolve-artifact.outputs.run_id || github.run_id }}
          REUSE: ${{ needs.resolve-artifact.outputs.reuse }}
          EXISTING_ARTIFACT_ID: ${{ needs.resolve-artifact.outputs.artifact_id }}
          EXISTING_ARTIFACT_NAME: ${{ needs.resolve-artifact.outputs.name }}
          UPLOADED_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          tarball="$(find release -maxdepth 1 -name 'certkit-*.tgz' -type f -print -quit)"
          test -n "$tarball"
          if [[ "$PACKAGE_PUBLISHED" == true ]]; then test -n "$REGISTRY_INTEGRITY"; fi
          ARTIFACT_RUN_ID="$ARTIFACT_RUN_ID" node scripts/release.mjs verify "$tarball" release/manifest.json
          {
            echo "artifact_id=${EXISTING_ARTIFACT_ID:-$UPLOADED_ARTIFACT_ID}"
            echo "run_id=$ARTIFACT_RUN_ID"
            echo "artifact_name=$EXISTING_ARTIFACT_NAME"
          } >> "$GITHUB_OUTPUT"

  consumer-smoke:
    name: consumer-smoke
    needs: [validate, produce]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      metadata_artifact_id: ${{ steps.metadata.outputs.artifact-id }}
      metadata_artifact_name: ${{ steps.metadata.outputs.artifact-name }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.selected }}
          persist-credentials: false
      - name: Check out consumer controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: release-controls
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.produce.outputs.artifact_id }}
          run-id: ${{ needs.produce.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release
      - name: Verify transferred digest and install the locked consumer
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.selected }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          ARTIFACT_RUN_ID: ${{ needs.produce.outputs.run_id }}
        run: |
          tarball="$(find release -maxdepth 1 -name 'certkit-*.tgz' -type f -print -quit)"
          node release-controls/scripts/prepare-consumer.mjs "$tarball" release/manifest.json consumer
          cd consumer
          npm ci --ignore-scripts --no-audit --no-fund
          node "$GITHUB_WORKSPACE/release-controls/scripts/check-deps.mjs" --consumer-tree "$PWD"
      - name: Check exports, declarations and CLI
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cd consumer
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { existsSync } from "node:fs";
            import { createRequire } from "node:module";
            import { dirname, resolve } from "node:path";
            const require = createRequire(import.meta.url);
            const pkgPath = require.resolve("certkit/package.json");
            const pkg = require(pkgPath);
            for (const entry of [".", "./vite"]) assert.ok(existsSync(resolve(dirname(pkgPath), pkg.exports[entry].types)));
            await import("certkit");
            await import("certkit/vite");
          '
          ./node_modules/.bin/certkit --version | grep -Fx "$RELEASE_VERSION"
      - name: Import in a network-isolated namespace
        run: |
          sudo unshare --net -- runuser -u "$(id -un)" -- "$(command -v node)" scripts/egress-smoke.mjs
      - name: Generate SBOM for installed consumer tree
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_SHA: ${{ needs.validate.outputs.selected }}
        run: |
          npm exec --yes --package=@cyclonedx/cdxgen@12.8.5 -- cdxgen -t nodejs -o release/sbom.cdx.json consumer
          node scripts/release.mjs bind-sbom release/sbom.cdx.json release/manifest.json
      - name: Upload SBOM metadata
        id: metadata
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: certkit-metadata-${{ needs.validate.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

  release:
    name: publish-and-release
    needs: [validate, resolve-artifact, produce, consumer-smoke]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && ((inputs.finalize_published_release && needs.validate.outputs.published == 'true') || inputs.resume_tagged_release))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm-publish
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.selected }}
          persist-credentials: false
      - name: Check out release controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: release-controls
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install npm for trusted publishing
        run: |
          npm install --global npm@11.21.0 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = 11.21.0
      - name: Verify immutable releases and reviewer gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SETTINGS_TOKEN: ${{ secrets.RELEASE_SETTINGS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/release.mjs settings
      - name: Download the same consumer-tested tarball
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.produce.outputs.artifact_id }}
          run-id: ${{ needs.produce.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release
      - name: Verify tarball and current registry state
        id: registry
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.selected }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          ARTIFACT_RUN_ID: ${{ needs.produce.outputs.run_id }}
        run: |
          tarball="$(find release -maxdepth 1 -name 'certkit-*.tgz' -type f -print -quit)"
          node scripts/release.mjs verify "$tarball" release/manifest.json
          node scripts/release.mjs state >> "$GITHUB_OUTPUT"
          integrity="$(node -e 'process.stdout.write(require("./release/manifest.json").integrity)')"
          if [[ "$(grep '^published=' "$GITHUB_OUTPUT" | tail -1)" == published=true ]]; then
            registry_integrity="$(grep '^integrity=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
            test "$registry_integrity" = "$integrity"
          fi
      - name: Require published version before metadata recovery
        if: github.event_name == 'workflow_dispatch' && inputs.finalize_published_release
        env:
          PACKAGE_PUBLISHED: ${{ steps.registry.outputs.published }}
        run: test "$PACKAGE_PUBLISHED" = true
      - name: Publish the tested tarball by OIDC
        if: steps.registry.outputs.published != 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.resume_tagged_release))
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          tarball="$(find release -maxdepth 1 -name 'certkit-*.tgz' -type f -print -quit)"
          npm_tag=latest
          if [[ "${RELEASE_VERSION%%+*}" == *-* ]]; then npm_tag=beta; fi
          npm publish "./$tarball" --tag "$npm_tag"
      - name: Confirm registry integrity after publish
        if: steps.registry.outputs.published != 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.resume_tagged_release))
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: node release-controls/scripts/release.mjs wait-registry release/manifest.json
      - name: Keep latest on the newest prerelease while it tracks one
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.resume_tagged_release)
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if [[ "${RELEASE_VERSION%%+*}" != *-* ]]; then exit 0; fi
          current="$(npm view certkit dist-tags.latest)"
          if [[ "$current" != *-* ]]; then exit 0; fi
          # OIDC dist-tag writes need the trusted publisher's "Allow npm dist-tag"
          # action. Warn instead of failing the release when it is not enabled.
          if ! npm dist-tag add "certkit@$RELEASE_VERSION" latest; then
            echo "::warning::latest still points at $current; enable 'Allow npm dist-tag' on the npm trusted publisher or run: npm dist-tag add certkit@$RELEASE_VERSION latest"
          fi
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.consumer-smoke.outputs.metadata_artifact_id }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: release-metadata
      - name: Attest tarball and SBOM separately
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.resume_tagged_release)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/certkit-*.tgz
      - name: Verify tagged recovery tarball attestation
        if: github.event_name == 'workflow_dispatch' && inputs.resume_tagged_release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          tarball="$(find release -maxdepth 1 -name 'certkit-*.tgz' -type f -print -quit)"
          gh attestation verify "$tarball" --repo "$GITHUB_REPOSITORY" --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --deny-self-hosted-runners
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-metadata/sbom.cdx.json
      - name: Verify the original tarball attestation
        if: github.event_name == 'workflow_dispatch' && inputs.finalize_published_release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.validate.outputs.selected }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          tarball="$(find release -maxdepth 1 -name 'certkit-*.tgz' -type f -print -quit)"
          gh attestation verify "$tarball" --repo "$GITHUB_REPOSITORY" --source-digest "$RELEASE_SHA" --source-ref "refs/tags/$RELEASE_TAG" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --deny-self-hosted-runners
      - name: Inspect any existing release
        id: release_state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          TARBALL_NAME: ${{ needs.produce.outputs.artifact_name }}
        run: |
          TARBALL_NAME="$(basename "$(find release -maxdepth 1 -name 'certkit-*.tgz' -type f -print -quit)")" node scripts/release.mjs release-state
      - name: Create or reuse draft
        if: steps.release_state.outputs.exists != 'true' || steps.release_state.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_RUN_EVENT: ${{ needs.resolve-artifact.outputs.event }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.selected }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_ACTION: ${{ steps.release_state.outputs.action }}
        run: |
          if [[ "$SOURCE_RUN_EVENT" == workflow_dispatch ]]; then
            printf 'First version was published interactively with 2FA; npm OIDC provenance is absent for this version.\n\n' > release-notes.md
          else
            : > release-notes.md
          fi
          printf 'Source commit: %s\nTarball SHA-256: %s\n' "$SOURCE_COMMIT" "$(sha256sum release/certkit-*.tgz | cut -d' ' -f1)" >> release-notes.md
          if [[ "$RELEASE_ACTION" == edit ]]; then
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          elif [[ "$RELEASE_ACTION" == create ]]; then
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
          else
            echo "unexpected release action: $RELEASE_ACTION" >&2
            exit 1
          fi
      - name: Attach tested package, digest manifest and SBOM
        if: steps.release_state.outputs.exists != 'true' || steps.release_state.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" release/certkit-*.tgz release/manifest.json release-metadata/sbom.cdx.json --clobber
      - name: Resolve the draft ID before publishing
        id: draft_release
        if: steps.release_state.outputs.exists != 'true' || steps.release_state.outputs.draft == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          TARBALL_NAME: ${{ needs.produce.outputs.artifact_name }}
        run: TARBALL_NAME="$(basename "$(find release -maxdepth 1 -name 'certkit-*.tgz' -type f -print -quit)")" node scripts/release.mjs release-state
      - name: Set draft prerelease metadata
        if: steps.release_state.outputs.exists != 'true' || steps.release_state.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRAFT_ID: ${{ steps.draft_release.outputs.id }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          test -n "$DRAFT_ID"
          prerelease=false
          if [[ "${RELEASE_VERSION%%+*}" == *-* ]]; then prerelease=true; fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID" --raw-field tag_name="$RELEASE_TAG" --field prerelease="$prerelease"
      - name: Verify draft before publishing
        if: steps.release_state.outputs.exists != 'true' || steps.release_state.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRAFT_ID: ${{ steps.draft_release.outputs.id }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          test -n "$DRAFT_ID"
          gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID" > release-draft.json
          TARBALL_NAME="$(basename "$(find release -maxdepth 1 -name 'certkit-*.tgz' -type f -print -quit)")" node release-controls/scripts/release.mjs verify-draft release-draft.json
      - name: Publish the draft last
        if: steps.release_state.outputs.exists != 'true' || steps.release_state.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRAFT_ACTION: ${{ steps.draft_release.outputs.action }}
          DRAFT_ID: ${{ steps.draft_release.outputs.id }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          test "$DRAFT_ACTION" = edit
          test -n "$DRAFT_ID"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID" --raw-field tag_name="$RELEASE_TAG" --field draft=false
      - name: Verify published release immutability and assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          TARBALL_NAME: ${{ needs.produce.outputs.artifact_name }}
        run: |
          status_file=release-state.txt
          : > "$status_file"
          GITHUB_OUTPUT="$status_file" TARBALL_NAME="$(basename "$(find release -maxdepth 1 -name 'certkit-*.tgz' -type f -print -quit)")" node scripts/release.mjs release-state
          grep -qx 'exists=true' "$status_file"
          grep -qx 'draft=false' "$status_file"

  bootstrap-summary:
    name: first-publication-handoff
    needs: [validate, produce, consumer-smoke]
    if: github.event_name == 'workflow_dispatch' && inputs.finalize_published_release != true && inputs.resume_tagged_release != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Record manual 2FA handoff
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_SHA: ${{ needs.validate.outputs.selected }}
          ARTIFACT_RUN_ID: ${{ needs.produce.outputs.run_id }}
          ARTIFACT_ID: ${{ needs.produce.outputs.artifact_id }}
        run: |
          echo "First-publication bootstrap complete; no OIDC publish step was run."
          echo "Version: $RELEASE_VERSION"
          echo "Source SHA: $RELEASE_SHA"
          echo "Producer run: $ARTIFACT_RUN_ID; artifact: $ARTIFACT_ID"
          echo "Download this tested tarball, verify its manifest SHA-256, publish it interactively with 2FA, then tag the same source as v$RELEASE_VERSION."
