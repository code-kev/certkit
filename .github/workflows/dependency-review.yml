name: Dependency Review

on:
  pull_request:

permissions: {}

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # Read the dependency diff for this PR.
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: >-
            MIT, Apache-2.0, BSD-1-Clause, BSD-2-Clause, BSD-2-Clause-Darwin,
            BSD-2-Clause-first-lines, BSD-2-Clause-FreeBSD, BSD-2-Clause-NetBSD,
            BSD-2-Clause-Patent, BSD-2-Clause-pkgconf-disclaimer,
            BSD-2-Clause-pos-unchanged, BSD-2-Clause-Views, BSD-3-Clause,
            BSD-3-Clause-acpica, BSD-3-Clause-Attribution, BSD-3-Clause-Clear,
            BSD-3-Clause-flex, BSD-3-Clause-HP, BSD-3-Clause-LBNL,
            BSD-3-Clause-Modification, BSD-3-Clause-No-Military-License,
            BSD-3-Clause-No-Nuclear-License, BSD-3-Clause-No-Nuclear-License-2014,
            BSD-3-Clause-No-Nuclear-Warranty, BSD-3-Clause-Open-MPI,
            BSD-3-Clause-OpenWebUI, BSD-3-Clause-Sun, BSD-3-Clause-Tso,
            BSD-4-Clause, BSD-4-Clause-Shortened, BSD-4-Clause-UC, BSD-4.3RENO,
            BSD-4.3TAHOE, BSD-Advertising-Acknowledgement, BSD-ask-to-endorse,
            BSD-Attribution-HPND-disclaimer, BSD-Inferno-Nettverk,
            BSD-Mark-Modifications, BSD-Protection, BSD-Source-alt-GPL,
            BSD-Source-beginning-file, BSD-Source-Code,
            BSD-Source-Code-no-disclaimer, BSD-Systemics, BSD-Systemics-W3Works,
            ISC, 0BSD, CC0-1.0
